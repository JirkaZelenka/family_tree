<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radial Family Tree</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
    }

    circle {
      fill: #4fc3f7;
    }

    text {
      font-size: 11px;
      fill: #eee;
    }

    line {
      stroke: #555;
      stroke-width: 1px;
    }
  </style>
</head>
<body>

<svg width="600" height="600"></svg>

<script>
const width = 600;
const height = 600;
const radius = width / 2 - 40;

const data = {
  name: "Me",
  children: [
    {
      name: "Mother",
      children: [
        { name: "Maternal Grandfather" },
        { name: "Maternal Grandmother" }
      ]
    },
    {
      name: "Father",
      children: [
        { name: "Paternal Grandfather" },
        { name: "Paternal Grandmother" }
      ]
    }
  ]
};

const svg = d3.select("svg")
  .append("g")
  .attr("transform", `translate(${width / 2}, ${height / 2})`);

const root = d3.hierarchy(data);

const tree = d3.tree()
  .size([2 * Math.PI, radius]);

tree(root);

// Links
svg.selectAll("line")
  .data(root.links())
  .enter()
  .append("line")
  .attr("x1", d => radialPoint(d.source.x, d.source.y)[0])
  .attr("y1", d => radialPoint(d.source.x, d.source.y)[1])
  .attr("x2", d => radialPoint(d.target.x, d.target.y)[0])
  .attr("y2", d => radialPoint(d.target.x, d.target.y)[1]);

// Nodes
const node = svg.selectAll("g")
  .data(root.descendants())
  .enter()
  .append("g")
  .attr("transform", d => {
    const [x, y] = radialPoint(d.x, d.y);
    return `translate(${x}, ${y})`;
  });

node.append("circle")
  .attr("r", 5);

node.append("text")
  .attr("dy", "0.31em")
  .attr("x", d => d.x < Math.PI ? 8 : -8)
  .attr("text-anchor", d => d.x < Math.PI ? "start" : "end")
  .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
  .text(d => d.data.name);

// Convert polar to cartesian
function radialPoint(angle, radius) {
  return [
    radius * Math.cos(angle - Math.PI / 2),
    radius * Math.sin(angle - Math.PI / 2)
  ];
}
</script>

<script src="sphere.js"></script>

</body>
</html>
